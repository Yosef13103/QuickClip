name: Released Personal upgrade acceptance
on:
  pull_request:
    branches: [integration/development, custom/main]
    paths:
      - 'src/QuickClip/Updates/**'
      - 'src/QuickClip/App.Update.cs'
      - 'src/QuickClip/App.xaml.cs'
      - 'src/QuickClip/QuickClip.csproj'
      - 'installer/**'
      - 'scripts/package.ps1'
      - 'scripts/test-released-personal-upgrade.ps1'
      - '.github/workflows/released-personal-upgrade.yml'
  push:
    branches: [integration/development]
    paths:
      - 'src/QuickClip/Updates/**'
      - 'src/QuickClip/App.Update.cs'
      - 'src/QuickClip/App.xaml.cs'
      - 'src/QuickClip/QuickClip.csproj'
      - 'installer/**'
      - 'scripts/package.ps1'
      - 'scripts/test-released-personal-upgrade.ps1'
      - '.github/workflows/released-personal-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade:
    name: Released 1.2.2 handoff (${{ matrix.layout }})
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        layout: [Default, Alternate]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Provision pinned dependencies
        run: ./scripts/get-deps.ps1 -Force
      - name: Package test candidate only (no publication)
        run: ./scripts/package.ps1 -Personal -FixtureVersion 1.3.0
      - name: Test exact released package and embedded worker
        run: |
          ./scripts/test-released-personal-upgrade.ps1 -Layout '${{ matrix.layout }}' -CandidateSetup publish-personal/QuickClip-Personal-1.3.0-setup.exe -CandidatePayload publish-personal/QuickClip-Personal
